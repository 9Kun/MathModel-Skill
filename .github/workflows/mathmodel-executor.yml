name: MathModel Executor

on:
  push:
    paths:
      - 'paper_output/control/run_stage.txt'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword libreoffice poppler-utils fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pypdf python-docx openpyxl xlrd pandas numpy scipy scikit-learn matplotlib seaborn statsmodels pillow

      - name: Prepare logs
        run: |
          mkdir -p paper_output/execution_logs paper_output/input_text paper_output/qa
          printf 'stage=%s\ncommit=%s\nutc=%s\n' "$(cat paper_output/control/run_stage.txt)" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > paper_output/execution_logs/execution_context.txt

      - name: Extract official inputs to traceable text
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import hashlib, json, subprocess

          root=Path('.')
          out=root/'paper_output'/'input_text'
          out.mkdir(parents=True, exist_ok=True)
          manifest=[]
          for p in sorted((root/'problem_files').iterdir()):
              if not p.is_file() or p.name=='.gitkeep':
                  continue
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              rec={'path':p.as_posix(),'size':p.stat().st_size,'sha256':sha,'extracted':False}
              try:
                  if p.suffix.lower()=='.pdf':
                      reader=PdfReader(str(p))
                      text='\n\n'.join(f'===== PAGE {i+1} =====\n'+(page.extract_text() or '') for i,page in enumerate(reader.pages))
                      (out/(p.name+'.txt')).write_text(text,encoding='utf-8')
                      rec.update(extracted=True,pages=len(reader.pages),chars=len(text))
                  elif p.suffix.lower()=='.docx':
                      doc=Document(str(p)); chunks=[]
                      for para in doc.paragraphs:
                          if para.text.strip(): chunks.append(para.text)
                      for ti,t in enumerate(doc.tables,1):
                          chunks.append(f'===== TABLE {ti} =====')
                          for row in t.rows:
                              chunks.append('\t'.join(cell.text for cell in row.cells))
                      text='\n'.join(chunks)
                      (out/(p.name+'.txt')).write_text(text,encoding='utf-8')
                      rec.update(extracted=True,chars=len(text),tables=len(doc.tables))
                  elif p.suffix.lower()=='.doc':
                      cp=subprocess.run(['antiword',str(p)],capture_output=True)
                      text=cp.stdout.decode('utf-8','replace')
                      (out/(p.name+'.txt')).write_text(text,encoding='utf-8')
                      rec.update(extracted=(cp.returncode==0 and len(text)>0),chars=len(text),exit_code=cp.returncode)
              except Exception as e:
                  rec['error']=f'{type(e).__name__}: {e}'
              manifest.append(rec)
          (out/'extraction_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: S0 preflight
        shell: bash
        run: |
          set +e
          python .agents/skills/paper-workflow-orchestrator/scripts/preflight_check.py > paper_output/execution_logs/s0_preflight.stdout.txt 2> paper_output/execution_logs/s0_preflight.stderr.txt
          code=$?
          echo "$code" > paper_output/execution_logs/s0_preflight.exit_code.txt
          python .agents/skills/paper-workflow-orchestrator/scripts/workflow_guard.py --status > paper_output/execution_logs/workflow_guard.stdout.txt 2> paper_output/execution_logs/workflow_guard.stderr.txt
          echo "$?" > paper_output/execution_logs/workflow_guard.exit_code.txt
          exit $code

      - name: Hash generated evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('paper_output')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); rows.append({'path':p.as_posix(),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'execution_logs'/'generated_files_sha256.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit execution evidence
        if: always()
        run: |
          git config user.name 'mathmodel-executor[bot]'
          git config user.email 'mathmodel-executor[bot]@users.noreply.github.com'
          git add paper_output
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist MathModel execution evidence"
            git push
          fi
